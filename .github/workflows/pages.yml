name: pages

# 产物布局（与 modelcontextprotocol.io 同形）：
#   /                      landing/（手写静态页）
#   /docs/2026-10-10/…     mike 构建的该版本
#   /docs/latest/…         latest 别名，指向同一版本
#
# 版本号 = 协议修订号，与主仓库 schema/2026-10-10/ 一致。新增修订时改 DOCS_VERSION。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DOCS_VERSION: "2026-10-10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs + plugins
        # mkdocs-static-i18n 是配置里 i18n 插件所需的依赖，漏了会直接 Abort
        run: pip install mkdocs-material mike mkdocs-static-i18n

      - name: Configure git (mike commits to gh-pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build & version docs
        run: |
          # --deploy-prefix docs：版本目录挂在 /docs/ 下，landing 留在根
          mike deploy --deploy-prefix docs --update-aliases "$DOCS_VERSION" latest
          mike list

      - name: Assemble site
        run: |
          mkdir -p _out
          # 取 mike 提交后的整棵树（含 docs/<version>/、versions.json、.nojekyll）
          git archive gh-pages | tar -x -C _out
          # landing 覆盖根目录的入口
          cp -r landing/. _out/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _out

      - id: deployment
        uses: actions/deploy-pages@v4
