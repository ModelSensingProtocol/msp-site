name: pages

# 产物布局：
#   /                  landing/（手写静态页，中英两版）
#   /docs/             Docusaurus 构建的文档站（默认展示 2026-10-10）
#   /docs/next/        未发布的下一版
#   /docs/spec|impl|design/  另外三个 docs 实例
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci --no-audit --no-fund

      - name: Build docs
        working-directory: docs-site
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _out
          cp -r landing/. _out/
          mkdir -p _out/docs
          cp -r docs-site/build/. _out/docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _out

      - id: deployment
        uses: actions/deploy-pages@v4
