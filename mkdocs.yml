site_name: MSP
site_description: Model Sensing Protocol — a local-first mesh where every app is a neighbour.
site_url: https://modelsensingprotocol.github.io/msp-site/docs/latest/
docs_dir: docs
site_dir: _docs

theme:
  name: material
  favicon: assets/favicon-32.png
  custom_dir: overrides
  language: en
  font: false            # 不拉 Google Fonts：用系统 Inter 回退，离线也正常
  features:
    - navigation.tabs          # 第二行 tab 导航（对齐 MCP 的 Documentation/…）
    - navigation.tabs.sticky
    - navigation.path          # 面包屑
    - navigation.footer        # 上一页/下一页（MCP 页尾那两个箭头）
    - navigation.tracking
    - navigation.top
    - content.code.copy        # 代码块复制按钮
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light

nav:
  - 文档:
      - 文档首页: index.md
      - 快速开始: intro.md
      - 架构与概念: architecture.md
      - 与 MCP 的区别: why-not-mcp.md
      - 提供能力: provide-tools.md
      - 发现、调用与订阅: consume.md
      - FAQ 与排查: faq.md
      - 术语表: glossary.md
  - 规范:
      - 规范总览: spec/index.md
      - 基础协议: spec/base-protocol.md
      - 架构: spec/architecture.md
      - 能力与清单: spec/capabilities.md
      - 发现与存在: spec/discovery.md
      - 传输: spec/transports.md
      - 模式: spec/patterns.md
      - 请求-应答: spec/patterns/request-reply.md
      - 发布-订阅: spec/patterns/publish-subscribe.md
      - 多轮: spec/patterns/multi-round.md
      - 任务: spec/patterns/task.md
      - Schema: spec/schema.md
      - 安全: spec/security.md
      - 互通: spec/interop.md
  - 实现: implementations.md
  - 设计: designs.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            文档: Documentation
            规范: Specification
            实现: Implementations
            设计: Designs
            规范总览: Overview
            基础协议: Base protocol
            能力与清单: Capabilities & manifest
            发现与存在: Discovery & presence
            传输: Transports
            模式: Patterns
            请求-应答: Request / reply
            发布-订阅: Publish / subscribe
            多轮: Multi-round
            任务: Task
            安全: Security
            互通: Interop
            文档首页: Home
            快速开始: Introduction
            架构与概念: Architecture & concepts
            与 MCP 的区别: Why MSP, not MCP
            提供能力: Provide tools and signals
            发现、调用与订阅: Discover, call, subscribe
            FAQ 与排查: FAQ & troubleshooting
            术语表: Glossary

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols

extra_css:
  - stylesheets/extra.css

copyright: >
  Copyright © MSP (Model Sensing Protocol) — an open protocol, MIT licensed.<br>
  Site content is documentation, not a specification; the normative text lives in the repository.

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ModelSensingProtocol/msp-site
      name: Site source
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/msp-py/
      name: msp-py on PyPI
  generator: false

# 规范章节的锚点是按 GitHub 规则写的（#8-取消 这类），Python-Markdown 生成 id 的
# 规则不同，逐条对齐不现实；文件级链接仍然严格校验，只把锚点降级。
validation:
  links:
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore
