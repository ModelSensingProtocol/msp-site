site_name: MSP documentation
site_description: Model Sensing Protocol — a local-first mesh where every app is a neighbour.
site_url: https://modelsensingprotocol.github.io/msp-site/docs/latest/
docs_dir: docs
site_dir: _docs

theme:
  name: material
  language: en
  font: false            # 不拉 Google Fonts：用系统 Inter 回退，离线也正常
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy        # 代码块复制按钮
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light

nav:
  - Home: index.md
  - Introduction: intro.md
  - Architecture & concepts: architecture.md
  - Why MSP, not MCP: why-not-mcp.md
  - Provide tools and signals: provide-tools.md
  - Discover, call, subscribe: consume.md
  - FAQ & troubleshooting: faq.md
  - Glossary: glossary.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
