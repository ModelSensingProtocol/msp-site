site_name: MSP documentation
site_description: Model Sensing Protocol — a local-first mesh where every app is a neighbour.
site_url: https://modelsensingprotocol.github.io/msp-site/docs/latest/
docs_dir: docs
site_dir: _docs

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false            # 不拉 Google Fonts：用系统 Inter 回退，离线也正常
  features:
    - navigation.tabs          # 第二行 tab 导航（对齐 MCP 的 Documentation/…）
    - navigation.tabs.sticky
    - navigation.path          # 面包屑
    - navigation.footer        # 上一页/下一页（MCP 页尾那两个箭头）
    - navigation.tracking
    - navigation.top
    - content.code.copy        # 代码块复制按钮
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light

nav:
  - Documentation:
      - 文档首页: index.md
      - 快速开始: intro.md
      - 架构与概念: architecture.md
      - 与 MCP 的区别: why-not-mcp.md
      - 提供能力: provide-tools.md
      - 发现、调用与订阅: consume.md
      - FAQ 与排查: faq.md
      - 术语表: glossary.md
  - Specification: https://github.com/hxh230802/MSP/blob/master/docs/spec/README.md
  - Implementations: https://github.com/ModelSensingProtocol/msp-ts
  - Designs: https://github.com/hxh230802/MSP/tree/master/docs

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            文档: Documentation
            文档首页: Home
            快速开始: Introduction
            架构与概念: Architecture & concepts
            与 MCP 的区别: Why MSP, not MCP
            提供能力: Provide tools and signals
            发现、调用与订阅: Discover, call, subscribe
            FAQ 与排查: FAQ & troubleshooting
            术语表: Glossary

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols

extra_css:
  - stylesheets/extra.css

copyright: >
  Copyright © MSP (Model Sensing Protocol) — an open protocol, MIT licensed.<br>
  Site content is documentation, not a specification; the normative text lives in the repository.

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ModelSensingProtocol/msp-site
      name: Site source
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/msp-py/
      name: msp-py on PyPI
  generator: false
